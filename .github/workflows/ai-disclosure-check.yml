name: SlopScore AI Code Check
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  slop-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Diffs against base branch

      - name: Run AI Code Pattern Check
        uses: kburrus64-max/slopscore-code@v1
        with:
          max: 20           # Fails if score goes above threshold
          comment: true     # Posts a summary comment directly on the PR
          fail-on-error: true
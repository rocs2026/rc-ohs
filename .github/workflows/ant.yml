# This workflow will build a Java project with Ant
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant

name: Java CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install IVY
        run: |
          mkdir -p "$HOME/.ant/lib"
          mkdir -p "$HOME/.ant/lib/junit"

          wget -O "$HOME/.ant/lib/ivy-2.5.2.jar" https://repo.maven.apache.org/maven2/org/apache/ivy/ivy/2.5.2/ivy-2.5.2.jar

          wget -O "$HOME/.ant/lib/ant-junitlauncher-1.10.14.jar" https://repo.maven.apache.org/maven2/org/apache/ant/ant-junitlauncher/1.10.14/ant-junitlauncher-1.10.14.jar

          wget -O "$HOME/.ant/lib/junit/junit-jupiter-api-5.11.4.jar" https://repo.maven.apache.org/maven2/org/junit/jupiter/junit-jupiter-api/5.11.4/junit-jupiter-api-5.11.4.jar

          wget -O "$HOME/.ant/lib/junit/junit-jupiter-engine-5.11.4.jar" https://repo.maven.apache.org/maven2/org/junit/jupiter/junit-jupiter-engine/5.11.4/junit-jupiter-engine-5.11.4.jar

          wget -O "$HOME/.ant/lib/junit/junit-platform-commons-1.11.4.jar" https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-commons/1.11.4/junit-platform-commons-1.11.4.jar

          wget -O "$HOME/.ant/lib/junit/junit-platform-engine-1.11.4.jar" https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-engine/1.11.4/junit-platform-engine-1.11.4.jar

          wget -O "$HOME/.ant/lib/junit/junit-platform-launcher-1.11.4.jar" https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-launcher/1.11.4/junit-platform-launcher-1.11.4.jar

          wget -O "$HOME/.ant/lib/junit/opentest4j-1.3.0.jar" https://repo.maven.apache.org/maven2/org/opentest4j/opentest4j/1.3.0/opentest4j-1.3.0.jar

      - name: Verify Ivy Installation
        run: |
          ls -lh "$HOME/.ant/lib/ivy-2.5.2.jar"

      - name: Copy Dependencies
        run: ant -lib "$HOME/.ant/lib" copy-dependencies

      - name: Build with Ant
        run: ant -lib "$HOME/.ant/lib" -noinput -buildfile build.xml
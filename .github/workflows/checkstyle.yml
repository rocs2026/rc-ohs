name: Checkstyle on Pull Request

on: [pull_request, workflow_dispatch]

permissions:
  contents: read
  checks: write

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Ivy
        run: |
          mkdir -p "$HOME/.ant/lib"
          curl -fsSL -o "$HOME/.ant/lib/ivy-2.6.0.jar" \
            https://repo.maven.apache.org/maven2/org/apache/ivy/ivy/2.6.0/ivy-2.6.0.jar

      - name: Run Checkstyle
        run: ant -lib "$HOME/.ant/lib" -noinput -buildfile build.xml checkstyle

      - name: Push Checkstyle results to GitHub
        if: always()
        uses: jwgmeligmeyling/checkstyle-github-action@v1.2
        with:
          path: 'build/reports/checkstyle-result.xml'
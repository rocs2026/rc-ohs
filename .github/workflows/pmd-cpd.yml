name: pmd-cpd

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  pmd-cpd-ant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Ant reads every jar in ~/.ant/lib, so Ivy is available to build.xml.
      - name: Install Ivy for Ant
        run: |
          mkdir -p ~/.ant/lib
          curl -sSL -o ~/.ant/lib/ivy-2.5.2.jar https://repo1.maven.org/maven2/org/apache/ivy/ivy/2.5.2/ivy-2.5.2.jar

      - name: Run CPD
        run: ant cpd

      - name: Run PMD
        run: ant pmd

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-cpd-reports
          path: build/reports/
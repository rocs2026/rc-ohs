# ---------------------------------------------------------------------------
# Application configuration
#
# db.vendor selects the database implementation: oracle or mysql.
# ConnectionHelper reads the matching db.<vendor>.* block below.
#
# Any value can be overridden at runtime without rebuilding, for example:
#   java -Ddb.vendor=mysql -jar build/dist/rc-ohs.jar
# ---------------------------------------------------------------------------
# change this to oracle or mysql for database connection
# ---------------------------------------------------------------------------
db.vendor=mysql

db.oracle.driver=oracle.jdbc.OracleDriver
db.oracle.url=jdbc:oracle:thin:@localhost:1521:rogate
db.oracle.username=rcis
db.oracle.password=Changeme0

db.mysql.driver=com.mysql.cj.jdbc.Driver
db.mysql.url=jdbc:mysql://localhost:3306/rcis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.username=rcis
db.mysql.password=Changeme0
